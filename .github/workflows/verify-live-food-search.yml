name: Verifica la búsqueda de alimentos publicada

on:
  push:
    branches: ['verify/busqueda-alimentos-publicada']

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/racion-browser" --no-save --package-lock=false --no-audit --no-fund playwright-core@1.62.1
      - name: Comprueba búsqueda en vivo y presentaciones guardadas
        run: |
          export PLAYWRIGHT_PATH="$RUNNER_TEMP/racion-browser/node_modules/playwright-core"
          node .github/scripts/verify-food-search.cjs https://racion-app.pages.dev/
