name: Verify published receipt reading

on:
  push:
    branches: ['verify/lectura-facturas-publicada']

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: npm install --prefix "$RUNNER_TEMP/racion-browser" --no-save --package-lock=false --no-audit --no-fund playwright-core@1.62.1
      - name: Verify real OCR and confirmation on the public beta
        run: |
          export PLAYWRIGHT_PATH="$RUNNER_TEMP/racion-browser/node_modules/playwright-core"
          export RECEIPT_SCREENSHOT_DIR="$RUNNER_TEMP/racion-public-receipt-proof"
          node .github/scripts/verify-receipt.cjs https://racion-app.pages.dev/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-receipt-browser-evidence
          path: ${{ runner.temp }}/racion-public-receipt-proof
          if-no-files-found: ignore
