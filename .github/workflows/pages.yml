name: Deploy Ración App

on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/configure-pages@v5
        id: pages
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - name: Install browser and Worker test runners
        run: npm install --prefix "$RUNNER_TEMP/racion-test-tools" --no-save --package-lock=false --no-audit --no-fund playwright-core@1.62.1 miniflare@4.20260730.0
      - name: Verify Worker and persistent quota ledger
        run: |
          export MINIFLARE_PATH="$RUNNER_TEMP/racion-test-tools/node_modules/miniflare"
          node .github/scripts/verify-price-worker.cjs
      - name: Verify adjustment and prices with controlled responses
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_PRICE_API_URL: https://prices.example.invalid/api/live-prices
        run: |
          fixture_dist="$RUNNER_TEMP/racion-price-fixture"
          export PLAYWRIGHT_PATH="$RUNNER_TEMP/racion-test-tools/node_modules/playwright-core"
          bun run build --outDir "$fixture_dist" --emptyOutDir
          bun run preview --outDir "$fixture_dist" --host 127.0.0.1 --port 4196 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          node .github/scripts/verify-pages.cjs "http://127.0.0.1:4196${PAGES_BASE_PATH%/}/" --price-fixtures
      - run: bun run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_PRICE_API_URL: ${{ vars.PRICE_API_URL }}
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  verify:
    name: Verify published diary
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/racion-browser" --no-save --package-lock=false --no-audit --no-fund playwright-core@1.62.1
      - run: |
          export PLAYWRIGHT_PATH="$RUNNER_TEMP/racion-browser/node_modules/playwright-core"
          node .github/scripts/verify-pages.cjs "$PAGES_URL"
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
